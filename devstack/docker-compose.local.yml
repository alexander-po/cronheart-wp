# Override layered on top of `docker-compose.yml` for a smoke run
# against a backend that runs on a local Docker network instead of
# cronheart.com (maintainers only).
#
# Joins the WordPress and WP-CLI containers to the backend's network,
# named by `CRONHEART_BACKEND_NETWORK`, so the plugin can reach the
# backend at the address passed to smoke.sh as `CRONHEART_ENDPOINT`.
#
# Usage:
#     CRONHEART_BACKEND_NETWORK=<network> docker compose \
#       -f devstack/docker-compose.yml \
#       -f devstack/docker-compose.local.yml \
#       up -d
#
# Public contributors should use the base compose file alone and
# smoke against cronheart.com.

services:
  wordpress:
    networks:
      - default
      - cronheart-backend

  wp-cli:
    networks:
      - default
      - cronheart-backend

networks:
  cronheart-backend:
    external: true
    name: ${CRONHEART_BACKEND_NETWORK:?set CRONHEART_BACKEND_NETWORK to the backend's Docker network}
