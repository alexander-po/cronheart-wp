# Local end-to-end smoke stack for cronheart-wp.
#
# On its own this compose file smokes against cronheart.com: WP + MySQL
# come up and the plugin pings the real service over the internet.
#
# For a smoke run against a backend on a local Docker network
# (maintainers only), layer `docker-compose.local.yml` on top; see
# README.md → "End-to-end smoke testing" for the full flow.

services:
  wp-mysql:
    image: mysql:8.0
    container_name: cronheart-wp-mysql
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwordpress", "-pwordpress"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    image: wordpress:7.1-php8.2-apache
    container_name: cronheart-wp-wordpress
    depends_on:
      wp-mysql:
        condition: service_healthy
    ports:
      # Host port 8082 to stay clear of other local stacks.
      - "8082:80"
    environment:
      WORDPRESS_DB_HOST: wp-mysql:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Disable WP-Cron's request-driven trigger so the smoke script
      # can drive it deterministically through WP-CLI. The real
      # `wp_schedule_event` registration still works; only the
      # automatic spawn-on-request is suppressed.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'DISABLE_WP_CRON', true );
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
    volumes:
      - wordpress-data:/var/www/html
      # Mount the built plugin zip so WP-CLI can install it from a
      # well-known path inside the container.
      - ../build/cronheart.zip:/tmp/cronheart.zip:ro

  wp-cli:
    image: wordpress:cli-php8.2
    container_name: cronheart-wp-cli
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: wp-mysql:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-data:/var/www/html
      - ../build/cronheart.zip:/tmp/cronheart.zip:ro
    # Keep the container long-lived so `docker compose exec wp-cli wp ...`
    # works without re-creating it for every command.
    entrypoint: ["tail", "-f", "/dev/null"]
    working_dir: /var/www/html

networks:
  default:
    name: cronheart-wp-default

volumes:
  wordpress-data:
